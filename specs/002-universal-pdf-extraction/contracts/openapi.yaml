openapi: 3.1.0
info:
  title: Lingua-Bloom structural extraction API additions
  version: 0.5.0
paths:
  /api/imports:
    post:
      summary: Admit a bounded PDF or pasted-text import
      security: [{ teacherSession: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [title, idempotencyKey]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                sourceFile: { type: string, format: binary }
                sourceText:
                  type: string
                  minLength: 1
                  description: Server normalizes CRLF/CR to LF, then admits at most 30,000 Unicode code points including whitespace
                idempotencyKey: { type: string, minLength: 16, maxLength: 128 }
              oneOf:
                - required: [sourceFile]
                  not: { required: [sourceText] }
                - required: [sourceText]
                  not: { required: [sourceFile] }
      responses:
        '202':
          description: Import accepted; processing is asynchronous
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportAccepted' }
        '400': { description: Invalid import request }
        '401': { description: Authentication required }
        '409': { description: Idempotency conflict }
        '413':
          description: PDF exceeds 5 pages or normalized text exceeds 30,000 Unicode characters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceLimitError' }
  /api/imports/{runId}:
    get:
      summary: Return owner-scoped import state with draft or structural review
      security: [{ teacherSession: [] }]
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      responses:
        '200':
          description: Draft and structuralReview are mutually exclusive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportReviewState' }
        '401': { description: Authentication required }
        '404': { description: Unknown or non-owned run }
  /api/imports/{runId}/layout-review:
    post:
      summary: Resolve structural-classification issues atomically
      security: [{ teacherSession: [] }]
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StructuralReviewSubmission' }
      responses:
        '202':
          description: Decisions persisted; the same run resumes or remains in review
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [runId, revision, status]
                properties:
                  runId: { type: string, minLength: 1 }
                  revision: { type: integer, minimum: 1 }
                  status: { enum: [awaiting_review, processing] }
        '400': { description: Invalid or incomplete decision payload }
        '401': { description: Authentication required }
        '404': { description: Unknown or non-owned run }
        '409': { description: Stale revision or conflicting idempotency key; no partial writes }
  /api/imports/{runId}/suggest-answers:
    get:
      summary: Calculate answer-suggestion request count, token estimate and cost ceiling without calling the model
      security: [{ teacherSession: [] }]
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      responses:
        '200':
          description: Free immutable preflight for the current draft revision
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [runId, revision, model, preflight]
                properties:
                  runId: { type: string, minLength: 1 }
                  revision: { type: integer, minimum: 1 }
                  model: { type: string, minLength: 1 }
                  preflight: { $ref: '#/components/schemas/AnswerSuggestionPreflight' }
    post:
      summary: Execute a confirmed, budget-bounded and checkpointed answer-suggestion plan
      security: [{ teacherSession: [] }]
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, idempotencyKey]
              properties:
                expectedRevision: { type: integer, minimum: 1 }
                idempotencyKey: { type: string, minLength: 16, maxLength: 128 }
                confirmedPlanHash: { type: string, minLength: 64, maxLength: 64 }
      responses:
        '200':
          description: Reviewable modelInferred suggestions persisted in a new revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnswerSuggestionExecutionResult' }
        '400':
          description: Invalid request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnswerSuggestionError' }
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnswerSuggestionError' }
        '404':
          description: Run not found for this teacher
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnswerSuggestionError' }
        '409':
          description: Draft conflict, batch already running or cost confirmation required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnswerSuggestionError' }
        '422':
          description: No fields remain or the configured estimated-cost limit was exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnswerSuggestionError' }
        '502':
          description: Provider failure; completed batches remain checkpointed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnswerSuggestionError' }
        '503':
          description: Provider unavailable; completed batches remain checkpointed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnswerSuggestionError' }
  /api/imports/{runId}/layout-review/suggest:
    get:
      summary: Calculate a zero-call RUB preflight for optional AI layout classification
      security: [{ teacherSession: [] }]
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      responses:
        '200':
          description: Exact plan requiring teacher confirmation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutAiPreflightResponse' }
    post:
      summary: Return checkpointed AI classification suggestions without persisting teacher decisions
      security: [{ teacherSession: [] }]
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, confirmedPlanHash]
              properties:
                expectedRevision: { type: integer, minimum: 1 }
                confirmedPlanHash: { type: string, minLength: 64, maxLength: 64 }
      responses:
        '200':
          description: Editable AI suggestions; teacher decisions remain unchanged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutAiSuggestionResult' }
        '409':
          description: Revision/confirmation conflict or request already running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutAiError' }
        '422':
          description: No candidates or RUB hard limit exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutAiError' }
        '502':
          description: Provider failure; teacher decisions remain unchanged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutAiError' }
        '503':
          description: Provider is not configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutAiError' }
components:
  securitySchemes:
    teacherSession:
      type: apiKey
      in: cookie
      name: sb-auth-token
  parameters:
    RunId:
      in: path
      name: runId
      required: true
      schema: { type: string, minLength: 1 }
  schemas:
    LayoutAiPreflight:
      type: object
      additionalProperties: false
      required: [schemaVersion, planHash, candidateCount, requestCount, estimatedTokens, estimatedCostRub, hardLimitRub, exceedsHardLimit, requiresConfirmation]
      properties:
        schemaVersion: { const: '1.0.0' }
        planHash: { type: string, minLength: 64, maxLength: 64 }
        candidateCount: { type: integer, minimum: 1 }
        requestCount: { const: 1 }
        estimatedTokens: { type: integer, minimum: 1 }
        estimatedCostRub: { type: number, minimum: 0 }
        hardLimitRub: { type: number, exclusiveMinimum: 0 }
        exceedsHardLimit: { type: boolean }
        requiresConfirmation: { const: true }
    LayoutAiPreflightResponse:
      type: object
      additionalProperties: false
      required: [runId, revision, model, preflight]
      properties:
        runId: { type: string, minLength: 1 }
        revision: { type: integer, minimum: 1 }
        model: { type: string, minLength: 1 }
        preflight: { $ref: '#/components/schemas/LayoutAiPreflight' }
    LayoutAiSuggestion:
      type: object
      additionalProperties: false
      required: [candidateId, classification, confidence, rationale]
      properties:
        candidateId: { type: string, minLength: 1 }
        classification:
          enum: [singleChoice, wordOrder, bracketGap, oddOneOut, inlineGap, shortText, reference, example, exclude]
        confidence: { type: number, minimum: 0, maximum: 1 }
        rationale: { type: string, minLength: 1, maxLength: 500 }
    LayoutAiSuggestionResult:
      type: object
      additionalProperties: false
      required: [runId, revision, preflight, suggestions, telemetry, reused]
      properties:
        runId: { type: string, minLength: 1 }
        revision: { type: integer, minimum: 1 }
        preflight: { $ref: '#/components/schemas/LayoutAiPreflight' }
        suggestions: { type: array, items: { $ref: '#/components/schemas/LayoutAiSuggestion' } }
        telemetry:
          type: object
          additionalProperties: false
          required: [model, promptVersion, pricingVersion, latencyMs, inputTokens, outputTokens, actualCost, actualCurrency]
          properties:
            model: { type: string, minLength: 1 }
            promptVersion: { const: layout-review-classification/1.0.0 }
            pricingVersion: { const: layout-review-rub-pricing/1.0.0 }
            latencyMs: { type: integer, minimum: 0 }
            inputTokens: { type: [integer, 'null'], minimum: 0 }
            outputTokens: { type: [integer, 'null'], minimum: 0 }
            actualCost: { type: [number, 'null'], minimum: 0 }
            actualCurrency: { type: [string, 'null'], minLength: 1 }
        reused: { type: boolean }
    LayoutAiError:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, minLength: 1 }
        message: { type: string, minLength: 1 }
    AnswerSuggestionPreflight:
      type: object
      additionalProperties: false
      required: [schemaVersion, planHash, answerFieldCount, batchCount, estimatedTokens, estimatedCostUsd, requiresConfirmation, exceedsHardLimit, hardLimitUsd]
      properties:
        schemaVersion: { const: '1.0.0' }
        planHash: { type: string, minLength: 64, maxLength: 64 }
        answerFieldCount: { type: integer, minimum: 0 }
        batchCount: { type: integer, minimum: 0 }
        estimatedTokens: { type: integer, minimum: 0 }
        estimatedCostUsd: { type: number, minimum: 0 }
        requiresConfirmation: { type: boolean }
        exceedsHardLimit: { type: boolean }
        hardLimitUsd: { type: number, exclusiveMinimum: 0 }
    AnswerSuggestionExecutionResult:
      type: object
      additionalProperties: false
      required: [runId, revision, suggestionCount, preflight, actualCostUsd]
      properties:
        runId: { type: string, minLength: 1 }
        revision: { type: integer, minimum: 1 }
        suggestionCount: { type: integer, minimum: 0 }
        preflight: { $ref: '#/components/schemas/AnswerSuggestionPreflight' }
        actualCostUsd: { type: [number, 'null'], minimum: 0 }
    AnswerSuggestionError:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, minLength: 1 }
        message: { type: string, minLength: 1 }
        currentRevision: { type: integer, minimum: 1 }
        preflight: { $ref: '#/components/schemas/AnswerSuggestionPreflight' }
    ImportAccepted:
      type: object
      additionalProperties: false
      required: [runId, sourceDocumentId, status]
      properties:
        runId: { type: string, minLength: 1 }
        sourceDocumentId: { type: string, minLength: 1 }
        status: { const: accepted }
    ImportReviewState:
      type: object
      additionalProperties: false
      required:
        - runId
        - status
        - currentStep
        - lastSuccessfulCheckpoint
        - updatedAt
        - recovery
        - failure
        - source
        - draft
        - structuralReview
        - documentIr
        - issues
        - events
      properties:
        runId: { type: string, minLength: 1 }
        status:
          enum: [accepted, processing, awaiting_review, blocked, ready_to_publish, completed, cancelled, failed]
        currentStep: { type: [string, 'null'] }
        lastSuccessfulCheckpoint: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }
        recovery:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/StaleRunRecovery'
        failure:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/FailureInfo'
        source:
          type: object
          additionalProperties: false
          required: [id, title, kind, signedUrl]
          properties:
            id: { type: string, minLength: 1 }
            title: { type: string }
            kind: { enum: [pdf, text] }
            signedUrl: { type: [string, 'null'] }
        draft:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/DraftEnvelope'
        structuralReview:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/StructuralReview'
        documentIr:
          oneOf:
            - type: 'null'
            - $ref: '../../001-reliable-source-ingestion/contracts/document-ir.schema.json'
        issues: { type: array, items: { $ref: '#/components/schemas/ImportIssue' } }
        events: { type: array, items: { $ref: '#/components/schemas/WorkflowEvent' } }
      allOf:
        - not:
            required: [draft, structuralReview]
            properties:
              draft: { type: object }
              structuralReview: { type: object }
        - if:
            properties: { status: { const: failed } }
            required: [status]
          then:
            properties:
              failure: { $ref: '#/components/schemas/FailureInfo' }
        - if:
            properties:
              status:
                enum: [accepted, processing, awaiting_review, blocked, ready_to_publish, completed, cancelled]
            required: [status]
          then:
            properties: { failure: { type: 'null' } }
    StaleRunRecovery:
      type: object
      additionalProperties: false
      required: [kind, redispatchAllowed, staleSince]
      properties:
        kind: { enum: [dispatch_not_started, worker_heartbeat_expired] }
        redispatchAllowed: { const: true }
        staleSince: { type: string, format: date-time }
    FailureInfo:
      type: object
      additionalProperties: false
      required: [code, kind, message, manualResumeAllowed]
      properties:
        code:
          enum: [SOURCE_TOO_LARGE, MODEL_UNAVAILABLE, MODEL_INVALID_OUTPUT, INTERNAL_FAILURE]
        kind: { enum: [retriable, terminal] }
        message: { type: string, minLength: 1 }
        manualResumeAllowed: { type: boolean }
        limitType: { enum: [pdfPages, textCharacters] }
        limit: { type: integer, minimum: 1 }
        actual: { type: integer, minimum: 1 }
      allOf:
        - if:
            properties: { code: { const: SOURCE_TOO_LARGE } }
            required: [code]
          then:
            required: [limitType, limit, actual]
    DraftEnvelope:
      type: object
      additionalProperties: false
      required: [id, revision, payload]
      properties:
        id: { type: string, minLength: 1 }
        revision: { type: integer, minimum: 1 }
        payload:
          type: object
          description: Strict canonical ReviewDraft union
    StructuralReview:
      type: object
      additionalProperties: false
      required:
        [schemaVersion, runId, sourceDocumentId, documentIrId, revision, status, reason, regions, issues, coverage, createdAt, updatedAt]
      properties:
        schemaVersion: { const: '1.1.0' }
        runId: { type: string, minLength: 1 }
        sourceDocumentId: { type: string, minLength: 1 }
        documentIrId: { type: string, minLength: 1 }
        revision: { type: integer, minimum: 1 }
        status: { const: active }
        reason:
          enum: [providerFailure, invalidOutput, reconciliationConflict, lowConfidence, unknownStructure]
        regions:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [id, blockIds, proposedRole, confidence, issueIds]
            properties:
              id: { type: string, minLength: 1 }
              blockIds: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
              proposedRole:
                enum: [sectionHeading, instruction, referenceMaterial, example, exercisePrompt, gapSegment, localOption, sharedBankEntry, answerKey, boilerplate, unknown]
              confidence: { type: number, minimum: 0, maximum: 1 }
              issueIds: { type: array, items: { type: string, minLength: 1 } }
        issues: { type: array, minItems: 1, items: { $ref: '#/components/schemas/ImportIssue' } }
        coverage:
          type: object
          additionalProperties: false
          required: [significantBlockCount, accountedBlockCount, status]
          properties:
            significantBlockCount: { type: integer, minimum: 1 }
            accountedBlockCount: { type: integer, minimum: 0 }
            status: { enum: [needsReview, blocked] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StructuralReviewSubmission:
      type: object
      additionalProperties: false
      required: [expectedRevision, idempotencyKey, decisions]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        idempotencyKey: { type: string, minLength: 16, maxLength: 128 }
        decisions:
          type: array
          minItems: 1
          items:
            oneOf:
              - $ref: '#/components/schemas/ChoiceStructuralDecision'
              - $ref: '#/components/schemas/GapStructuralDecision'
              - $ref: '#/components/schemas/WordBankStructuralDecision'
              - $ref: '#/components/schemas/WordOrderStructuralDecision'
              - $ref: '#/components/schemas/MatchingStructuralDecision'
              - $ref: '#/components/schemas/NonStudentStructuralDecision'
    ChoiceStructuralDecision:
      type: object
      additionalProperties: false
      required: [regionId, action, interactionKind, structuralFields, reason]
      properties:
        regionId: { type: string, minLength: 1 }
        action: { const: classify }
        interactionKind: { enum: [singleChoice, oddOneOut] }
        structuralFields:
          type: object
          additionalProperties: false
          required: [prompt, options, answerFieldCount]
          properties:
            prompt: { type: string, minLength: 1 }
            options: { type: array, minItems: 2, items: { type: string, minLength: 1 } }
            answerFieldCount: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1 }
    GapStructuralDecision:
      type: object
      additionalProperties: false
      required: [regionId, action, interactionKind, structuralFields, reason]
      properties:
        regionId: { type: string, minLength: 1 }
        action: { const: classify }
        interactionKind: { enum: [bracketGap, inlineGap] }
        structuralFields:
          type: object
          additionalProperties: false
          required: [prompt, answerFieldCount]
          properties:
            prompt: { type: string, minLength: 1 }
            answerFieldCount: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1 }
    WordBankStructuralDecision:
      type: object
      additionalProperties: false
      required: [regionId, action, interactionKind, structuralFields, reason]
      properties:
        regionId: { type: string, minLength: 1 }
        action: { const: classify }
        interactionKind: { const: wordBankGap }
        structuralFields:
          type: object
          additionalProperties: false
          required: [prompt, answerFieldCount, sharedEntries, usagePolicy]
          properties:
            prompt: { type: string, minLength: 1 }
            answerFieldCount: { type: integer, minimum: 1 }
            sharedEntries: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
            usagePolicy: { enum: [useOnce, reusable, unspecified] }
        reason: { type: string, minLength: 1 }
    WordOrderStructuralDecision:
      type: object
      additionalProperties: false
      required: [regionId, action, interactionKind, structuralFields, reason]
      properties:
        regionId: { type: string, minLength: 1 }
        action: { const: classify }
        interactionKind: { const: wordOrder }
        structuralFields:
          type: object
          additionalProperties: false
          required: [prompt, segments, answerFieldCount]
          properties:
            prompt: { type: string, minLength: 1 }
            segments: { type: array, minItems: 2, items: { type: string, minLength: 1 } }
            answerFieldCount: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1 }
    MatchingStructuralDecision:
      type: object
      additionalProperties: false
      required: [regionId, action, interactionKind, structuralFields, reason]
      properties:
        regionId: { type: string, minLength: 1 }
        action: { const: classify }
        interactionKind: { const: matching }
        structuralFields:
          type: object
          additionalProperties: false
          required: [items, sharedEntries, usagePolicy]
          properties:
            items:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [prompt, answerFieldCount]
                properties:
                  prompt: { type: string, minLength: 1 }
                  answerFieldCount: { const: 1 }
            sharedEntries: { type: array, minItems: 2, items: { type: string, minLength: 1 } }
            usagePolicy: { const: useOnce }
        reason: { type: string, minLength: 1 }
    NonStudentStructuralDecision:
      type: object
      additionalProperties: false
      required: [regionId, action, reason]
      properties:
        regionId: { type: string, minLength: 1 }
        action: { enum: [reference, example, exclude] }
        reason: { type: string, minLength: 1 }
    SourceLimitError:
      type: object
      additionalProperties: false
      required: [code, message, limitType, limit, actual]
      properties:
        code: { const: SOURCE_TOO_LARGE }
        message: { type: string, minLength: 1 }
        limitType: { enum: [pdfPages, textCharacters] }
        limit: { type: integer, minimum: 1 }
        actual: { type: integer, minimum: 1 }
    ImportIssue:
      type: object
      additionalProperties: false
      required: [id, code, severity, resolution, createdAt]
      properties:
        id: { type: string, minLength: 1 }
        code: { type: string, minLength: 1 }
        severity: { enum: [info, warning, blocking] }
        resolution: { enum: [open, resolved, acceptedRisk] }
        createdAt: { type: string, format: date-time }
    WorkflowEvent:
      type: object
      additionalProperties: false
      required: [sequence, type, status, step, occurredAt]
      properties:
        sequence: { type: integer, minimum: 1 }
        type: { type: string, minLength: 1 }
        status: { type: string, minLength: 1 }
        step: { type: [string, 'null'] }
        occurredAt: { type: string, format: date-time }
