openapi: 3.1.0
info:
  title: Lingua Bloom Teacher Attempt History
  version: 1.0.0
paths:
  /api/attempts:
    get:
      summary: List owner-scoped student attempts
      parameters:
        - { name: cursor, in: query, schema: { type: string, maxLength: 500 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: query, in: query, schema: { type: string, maxLength: 160 } }
        - { name: lessonId, in: query, schema: { type: string, format: uuid } }
        - { name: resultStatus, in: query, schema: { enum: [correct, partial, incorrect] } }
        - { name: deliveryStatus, in: query, schema: { enum: [pending, sending, sent, skipped, failed] } }
      responses:
        "200":
          description: Private teacher attempt page
          headers:
            Cache-Control: { schema: { type: string, const: "private, no-store" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttemptHistoryPage" }
        "401": { description: Teacher authentication required }
  /api/attempts/{attemptId}:
    get:
      summary: Read one owned immutable attempt
      parameters:
        - { name: attemptId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Attempt detail in published lesson order
          headers:
            Cache-Control: { schema: { type: string, const: "private, no-store" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttemptDetail" }
        "401": { description: Teacher authentication required }
        "404": { description: Unknown or foreign attempt }
components:
  schemas:
    Delivery:
      type: object
      additionalProperties: false
      required: [status, failureCategory]
      properties:
        status: { enum: [pending, sending, sent, skipped, failed] }
        failureCategory:
          oneOf:
            - { enum: [unauthorized, rate_limited, provider, ambiguous, internal] }
            - { type: "null" }
    AttemptSummary:
      type: object
      additionalProperties: false
      required: [attemptId, lessonId, lessonTitle, lessonVersion, studentDisplayName, createdAt, correctCount, totalCount, resultStatus, delivery]
      properties:
        attemptId: { type: string, format: uuid }
        lessonId: { type: string, format: uuid }
        lessonTitle: { type: string }
        lessonVersion: { type: integer, minimum: 1 }
        studentDisplayName: { type: string, minLength: 1, maxLength: 120 }
        createdAt: { type: string, format: date-time }
        correctCount: { type: integer, minimum: 0 }
        totalCount: { type: integer, minimum: 1, maximum: 500 }
        resultStatus: { enum: [correct, partial, incorrect] }
        delivery: { $ref: "#/components/schemas/Delivery" }
    AttemptHistoryPage:
      type: object
      additionalProperties: false
      required: [schemaVersion, items, totalMatched, nextCursor]
      properties:
        schemaVersion: { const: 1.0.0 }
        items: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/AttemptSummary" } }
        totalMatched: { type: integer, minimum: 0 }
        nextCursor: { oneOf: [{ type: string }, { type: "null" }] }
    AttemptField:
      type: object
      additionalProperties: false
      required: [ordinal, groupOrdinal, groupInstruction, exerciseOrdinal, exercisePrompt, exerciseId, fieldId, submittedValue, status, acceptedDisplayValues]
      properties:
        ordinal: { type: integer, minimum: 1 }
        groupOrdinal: { type: integer, minimum: 1 }
        groupInstruction: { type: string }
        exerciseOrdinal: { type: integer, minimum: 1 }
        exercisePrompt: { type: string }
        exerciseId: { type: string }
        fieldId: { type: string }
        submittedValue:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        status: { enum: [correct, incorrect] }
        acceptedDisplayValues: { type: array, items: { type: string } }
    AttemptDetail:
      type: object
      additionalProperties: false
      required: [schemaVersion, summary, fields]
      properties:
        schemaVersion: { const: 1.0.0 }
        summary: { $ref: "#/components/schemas/AttemptSummary" }
        fields: { type: array, minItems: 1, maxItems: 500, items: { $ref: "#/components/schemas/AttemptField" } }
