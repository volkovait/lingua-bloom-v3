openapi: 3.1.0
info:
  title: Lingua-Bloom Source Ingestion API
  version: 0.3.0
paths:
  /api/imports:
    post:
      summary: Validate and persist a PDF or text source, create one run, and start processing
      security:
        - teacherSession: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [title, idempotencyKey]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                sourceFile: { type: string, format: binary }
                sourceText: { type: string, minLength: 1 }
                idempotencyKey: { type: string, minLength: 16, maxLength: 128 }
              oneOf:
                - required: [sourceFile]
                  not: { required: [sourceText] }
                - required: [sourceText]
                  not: { required: [sourceFile] }
      responses:
        '202':
          description: Import accepted without waiting for processing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportAccepted' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409':
          description: Idempotency key was already bound to a different request fingerprint
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdempotencyConflict' }
        '413': { $ref: '#/components/responses/SourceTooLarge' }
        '503':
          description: Import was retained but durable event dispatch must be retried with the same key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventDispatchFailed' }
  /api/imports/{runId}:
    get:
      summary: Return the owner's run state, ordered events, issues, and draft reference
      security:
        - teacherSession: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Current import state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Run not found }
  /api/imports/{runId}/resume:
    post:
      summary: Manually resume an owner-controlled run after a retriable failure
      security:
        - teacherSession: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResumeSubmission' }
      responses:
        '202': { description: Resume accepted; the same run continues from its last checkpoint }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Run not found }
        '409': { description: Run is not retriable or the idempotency key conflicts }
  /api/imports/{runId}/dispatch:
    post:
      summary: Idempotently redispatch an owner-controlled stale accepted or processing run
      security:
        - teacherSession: []
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedispatchSubmission" }
      responses:
        "202": { description: Redispatch accepted for the same run }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: Run not found }
        "409": { description: Run is not stale, already has a draft, or the idempotency key conflicts }
        "503": { description: Claim persisted but event delivery failed; retry with the same key }
  /api/imports/{runId}/review:
    post:
      summary: Submit idempotent teacher decisions and resume processing
      security:
        - teacherSession: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewSubmission' }
      responses:
        '202': { description: Review accepted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Idempotency conflict or stale draft version
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DraftVersionConflict'
                  - $ref: '#/components/schemas/IdempotencyConflict'
  /api/imports/{runId}/publish:
    post:
      summary: Publish an immutable lesson version after all gates pass
      security:
        - teacherSession: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishSubmission' }
      responses:
        '201':
          description: Lesson version created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishedVersion' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The canonical publication-readiness gate returned one or more reasons
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationBlocked' }
  /api/lessons/{lessonId}/versions:
    get:
      summary: List immutable lesson versions available to the owner
      security:
        - teacherSession: []
      parameters:
        - $ref: '#/components/parameters/LessonId'
      responses:
        '200':
          description: Ordered lesson versions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PublishedVersion' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/lessons/{publicLessonId}/student:
    get:
      summary: Return the student-safe projection of the latest published version
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicLessonId'
      responses:
        '200':
          description: Latest published version; contract excludes answer keys and internal provenance
          headers:
            X-Robots-Tag:
              description: Public capability pages must not be indexed
              schema: { type: string, const: 'noindex, nofollow' }
          content:
            application/json:
              schema: { $ref: './student-lesson-spec.schema.json' }
        '404': { description: Unknown or unpublished public lesson ID }
components:
  securitySchemes:
    teacherSession:
      type: apiKey
      in: cookie
      name: sb-auth-token
      description: Supabase SSR project-scoped auth cookie; the deployed cookie may be chunked
  parameters:
    RunId:
      in: path
      name: runId
      required: true
      schema: { type: string, minLength: 1 }
    LessonId:
      in: path
      name: lessonId
      required: true
      schema: { type: string, minLength: 1 }
    PublicLessonId:
      in: path
      name: publicLessonId
      required: true
      schema:
        type: string
        minLength: 22
        pattern: '^[A-Za-z0-9_-]+$'
  responses:
    InvalidInput:
      description: Invalid source, unsupported MIME type, or both/neither source fields supplied
    Unauthenticated:
      description: Valid teacher session required
    Forbidden:
      description: Authenticated teacher does not own the requested resource
    SourceTooLarge:
      description: Source exceeds a pre-persistence input limit
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SourceTooLargeError' }
  schemas:
    ImportAccepted:
      type: object
      additionalProperties: false
      required: [runId, sourceDocumentId, status]
      properties:
        runId: { type: string }
        sourceDocumentId: { type: string }
        status: { const: accepted }
    ImportStatus:
      type: object
      additionalProperties: false
      required: [runId, status, updatedAt, recovery, events, issues, failure]
      properties:
        runId: { type: string }
        status:
          enum: [accepted, processing, awaiting_review, blocked, ready_to_publish, completed, cancelled, failed]
        updatedAt: { type: string, format: date-time }
        recovery:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/StaleRunRecovery"
        events: { type: array, items: { type: object } }
        issues: { type: array, items: { type: object } }
        draftId: { type: [string, 'null'] }
        failure:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/FailureInfo'
      allOf:
        - if:
            properties: { status: { const: failed } }
          then:
            properties:
              failure: { $ref: '#/components/schemas/FailureInfo' }
        - if:
            properties: { status: { const: blocked } }
          then:
            properties: { issues: { minItems: 1 } }
        - if:
            properties:
              status:
                enum: [accepted, processing, awaiting_review, blocked, ready_to_publish, completed, cancelled]
          then:
            properties: { failure: { type: 'null' } }
    FailureInfo:
      type: object
      additionalProperties: false
      required: [code, kind, message, manualResumeAllowed]
      properties:
        code: { type: string, minLength: 1 }
        kind: { enum: [retriable, terminal] }
        message: { type: string, minLength: 1 }
        manualResumeAllowed: { type: boolean }
        limitType: { enum: [pdfPages, pdfBytes, textCharacters, answerFields] }
        limit: { type: integer, minimum: 1 }
        actual: { type: integer, minimum: 1 }
      allOf:
        - if:
            properties: { kind: { const: retriable } }
          then:
            properties: { manualResumeAllowed: { const: true } }
        - if:
            properties: { kind: { const: terminal } }
          then:
            properties: { manualResumeAllowed: { const: false } }
        - if:
            properties: { code: { const: SOURCE_TOO_LARGE } }
          then:
            required: [limitType, limit, actual]
    SourceTooLargeError:
      type: object
      additionalProperties: false
      required: [code, message, limitType, limit, actual, splitRequired, partsBecomeSeparateLessons]
      properties:
        code: { const: SOURCE_TOO_LARGE }
        message: { type: string, minLength: 1 }
        limitType: { enum: [pdfPages, pdfBytes, textCharacters, answerFields] }
        limit: { type: integer, minimum: 1 }
        actual: { type: integer, minimum: 1 }
        splitRequired: { const: true }
        partsBecomeSeparateLessons: { const: true }
    EventDispatchFailed:
      type: object
      additionalProperties: false
      required: [code, message, runId, sourceDocumentId]
      properties:
        code: { const: EVENT_DISPATCH_FAILED }
        message: { type: string, minLength: 1 }
        runId: { type: string, minLength: 1 }
        sourceDocumentId: { type: string, minLength: 1 }
    DraftVersionConflict:
      type: object
      additionalProperties: false
      required: [code, message, currentDraftVersion]
      properties:
        code: { const: DRAFT_VERSION_CONFLICT }
        message: { type: string, minLength: 1 }
        currentDraftVersion: { type: integer, minimum: 1 }
    IdempotencyConflict:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { const: IDEMPOTENCY_CONFLICT }
        message: { type: string, minLength: 1 }
    StaleRunRecovery:
      type: object
      additionalProperties: false
      required: [kind, redispatchAllowed, staleSince]
      properties:
        kind: { enum: [dispatch_not_started, worker_heartbeat_expired] }
        redispatchAllowed: { const: true }
        staleSince: { type: string, format: date-time }
    RedispatchSubmission:
      type: object
      additionalProperties: false
      required: [idempotencyKey]
      properties:
        idempotencyKey: { type: string, minLength: 16, maxLength: 128 }
    ResumeSubmission:
      type: object
      additionalProperties: false
      required: [idempotencyKey]
      properties:
        idempotencyKey: { type: string, minLength: 16, maxLength: 128 }
    ReviewSubmission:
      type: object
      additionalProperties: false
      required: [draftVersion, idempotencyKey]
      anyOf:
        - properties: { decisions: { minItems: 1 } }
        - properties: { answerReviews: { minItems: 1 } }
        - properties: { exerciseEdits: { minItems: 1 } }
      properties:
        draftVersion: { type: integer, minimum: 1 }
        idempotencyKey: { type: string, minLength: 16, maxLength: 128 }
        decisions:
          type: array
          default: []
          items:
            type: object
            additionalProperties: false
            required: [issueId, decision, reason]
            properties:
              issueId: { type: string, format: uuid }
              decision: { enum: [confirm, edit, exclude] }
              reason: { type: string, minLength: 1 }
              replacementValue: { type: [string, "null"] }
        answerReviews:
          type: array
          default: []
          items:
            type: object
            additionalProperties: false
            required: [answerFieldId, decision, reason, replacementValue]
            properties:
              answerFieldId: { type: string, minLength: 1 }
              issueId: { type: [string, "null"], format: uuid }
              decision: { enum: [confirm, edit] }
              reason: { type: string, minLength: 1 }
              replacementValue: { type: string, minLength: 1 }
        exerciseEdits:
          type: array
          default: []
          items:
            type: object
            additionalProperties: false
            required: [exerciseId, prompt, options]
            properties:
              exerciseId: { type: string, minLength: 1 }
              prompt: { type: string, minLength: 1 }
              options:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [id, value]
                  properties:
                    id: { type: string, minLength: 1 }
                    value: { type: string }
    PublishSubmission:
      type: object
      additionalProperties: false
      properties:
        confirmPermanentPublicAccess:
          const: true
          description: Required by the server only when the lesson has never been published before
    PublicationBlocked:
      type: object
      additionalProperties: false
      required: [code, message, reasons]
      properties:
        code: { const: PUBLISH_BLOCKED }
        message: { type: string, minLength: 1 }
        reasons:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, minLength: 1 }
    PublishedVersion:
      type: object
      additionalProperties: false
      required: [lessonId, publicLessonId, version]
      properties:
        lessonId: { type: string }
        publicLessonId:
          type: string
          minLength: 22
          pattern: '^[A-Za-z0-9_-]+$'
        version: { type: integer, minimum: 1 }
